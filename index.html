<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Calendar Year Training</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --text: #000;
      --muted: #9aa0a6;
      --panel: #fff;
      --border: #dadce0;
      --button: #d7e2f5;
      --button-hover: #c7d7f0;
      --button-border: #d7e2f5;
      --button-text: #163a70;
      --blue: #0099ff;
      --red: #d93025;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      align-items: center;
      background: var(--bg);
      color: var(--text);
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      justify-content: center;
      min-height: 100svh;
    }

    main {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 4vw, 32px);
      justify-content: center;
      max-width: 720px;
      padding: 28px 18px;
      text-align: center;
      width: 100%;
    }

    .site-title {
      color: var(--text);
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.35;
      margin: 0;
    }

    #question {
      font-size: clamp(96px, 28vw, 220px);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 0.9;
      min-height: 0.9em;
    }

    .result-box {
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      display: grid;
      font-size: clamp(28px, 8vw, 52px);
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: 82px;
      padding: 14px 18px;
      width: min(100%, 520px);
    }

    .result-box span {
      min-width: 1.5em;
    }

    .answer-buttons {
      display: grid;
      gap: clamp(7px, 1.8vw, 12px);
      grid-template-columns: repeat(7, minmax(0, 1fr));
      width: min(100%, 560px);
    }

    .answer-buttons button {
      aspect-ratio: 0.78;
      background: var(--button);
      border: 1px solid var(--button-border);
      border-radius: 5px;
      color: var(--button-text);
      cursor: pointer;
      font-size: clamp(20px, 6vw, 34px);
      font-weight: 600;
      transition: background-color 80ms ease, border-color 80ms ease, transform 80ms ease;
    }

    .answer-buttons button:hover,
    .answer-buttons button:focus-visible {
      background: var(--button-hover);
      border-color: var(--button-text);
      outline: none;
    }

    .answer-buttons button:active {
      transform: scale(0.96);
    }

    .settings,
    .language-settings {
      width: min(100%, 520px);
    }

    .settings-header {
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: center;
      padding: 10px 14px;
    }

    .settings.open .settings-header {
      border-radius: 14px 14px 0 0;
    }

    .settings-toggle {
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      padding: 4px 8px;
    }

    .settings-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: none;
      margin-top: 0;
      padding: 18px;
      text-align: left;
    }

    .settings.open .settings-panel {
      border-radius: 0 0 14px 14px;
      border-top: 0;
    }

    .settings-panel.open {
      display: block;
    }

    .setting-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .setting-box + .setting-box {
      margin-top: 12px;
    }

    .mode-row,
    .preset-row,
    .advanced-row,
    .language-row {
      align-items: center;
      display: flex;
      gap: 10px;
      margin: 0 0 14px;
    }

    .preset-row,
    .advanced-row {
      flex-wrap: wrap;
      margin-bottom: 0;
    }

    .setting-title {
      color: var(--muted);
      flex-basis: 100%;
      font-size: 14px;
      letter-spacing: 0.08em;
      line-height: 1.4;
      margin-bottom: 2px;
    }

    .language-row {
      justify-content: space-between;
      margin-bottom: 0;
    }

    .language-row select,
    .advanced-filter {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      padding: 6px 10px;
    }

    .advanced-filter {
      min-height: 150px;
      resize: vertical;
      width: 100%;
    }

    .apply-button {
      background: var(--button);
      border: 1px solid var(--button-border);
      border-radius: 8px;
      color: var(--button-text);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      margin-top: 12px;
      padding: 8px 16px;
    }

    .apply-button:hover,
    .apply-button:focus-visible {
      background: var(--button-hover);
      border-color: var(--button-text);
      outline: none;
    }

    .question-pool-debug {
      border-top: 1px solid var(--border);
      margin-top: 14px;
      padding-top: 12px;
      width: 100%;
    }

    .question-pool-debug-toggle {
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      padding: 4px 0;
      text-align: left;
    }

    .question-pool-debug-body {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      padding-top: 8px;
    }

    .question-pool-debug-summary {
      color: var(--text);
      margin-bottom: 6px;
    }

    .mode-row:last-child {
      margin-bottom: 0;
    }

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: var(--text);
      height: 18px;
      width: 18px;
    }

    #modeLabel {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    .correct {
      color: var(--blue);
    }

    .wrong {
      color: var(--red);
    }

    @media (max-width: 420px) {
      main {
        gap: 18px;
        padding-inline: 12px;
      }

      .result-box {
        min-height: 68px;
        padding-inline: 10px;
      }

      .answer-buttons {
        gap: 6px;
      }

      .answer-buttons button {
        border-radius: 5px;
      }

    }
  </style>
</head>
<body>
  <main>
    <h1 id="siteTitle" class="site-title">SpeedCalendar　下二桁値丸暗記トレーナー</h1>

    <div id="question" aria-live="polite">00</div>

    <div class="result-box" aria-label="前回の結果">
      <span id="lastQuestion"></span>
      <span id="lastAnswer"></span>
      <span id="lastCorrect"></span>
    </div>

    <div class="answer-buttons" aria-label="回答ボタン">
      <button type="button" data-answer="0">0</button>
      <button type="button" data-answer="1">1</button>
      <button type="button" data-answer="2">2</button>
      <button type="button" data-answer="3">3</button>
      <button type="button" data-answer="4">4</button>
      <button type="button" data-answer="5">5</button>
      <button type="button" data-answer="6">6</button>
    </div>

    <section id="settingsSection" class="settings">
      <div class="settings-header">
        <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
          ▼ 出題設定
        </button>
        <div id="modeLabel">Mode:All</div>
      </div>

      <div id="settingsPanel" class="settings-panel">
        <div class="setting-box" aria-label="設定モード">
          <label class="mode-row">
            <input type="radio" name="settingMode" value="preset" checked>
            <span id="presetModeText">Preset</span>
          </label>
          <label class="mode-row">
            <input type="radio" name="settingMode" value="advanced">
            <span id="advancedModeText">Advanced</span>
          </label>
        </div>

        <div id="presetBox" class="setting-box" aria-label="プリセット">
          <div class="preset-row">
            <span id="presetText" class="setting-title">Preset</span>
            <label>
              <input type="radio" name="preset" value="all" checked>
              <span id="presetAllText">All (00-99)</span>
            </label>
            <label>
              <input type="radio" name="preset" value="cycle1">
              <span id="presetEasyText">Easy (0-27)</span>
            </label>
          </div>
        </div>

        <div id="advancedBox" class="setting-box" aria-label="詳細設定" hidden>
          <div class="advanced-row">
            <label id="advancedFilterLabel" class="setting-title" for="advancedFilter">Filter</label>
            <textarea id="advancedFilter" class="advanced-filter" spellcheck="false">all</textarea>
            <button id="applyFilterButton" class="apply-button" type="button">Apply</button>
            <div class="question-pool-debug">
              <button id="questionPoolDebugToggle" class="question-pool-debug-toggle" type="button" aria-expanded="false" aria-controls="questionPoolDebugBody">
                ▼ Question Pool (Debug)
              </button>
              <div id="questionPoolDebugBody" class="question-pool-debug-body" hidden>
                <div id="questionPoolDebugSummary" class="question-pool-debug-summary">Empty</div>
                <div id="questionPoolDebugStats">Total: 0<br>Unique: 0</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <section class="language-settings setting-box" aria-label="言語設定">
      <label class="language-row" for="languageSelect">
        <span id="languageLabel">Language:</span>
        <select id="languageSelect">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </section>
  </main>

  <script>
    const values = [
      0,1,2,3,5,6,0,1,3,4,
      5,6,1,2,3,4,6,0,1,2,
      4,5,6,0,2,3,4,5
    ];

    const translations = {
      ja: {
        title: 'SpeedCalendar　下二桁値丸暗記トレーナー',
        settings: '出題設定',
        presetMode: 'Preset',
        advancedMode: 'Advanced',
        preset: 'Preset',
        presetAll: 'All (00-99)',
        presetEasy: 'Easy (0-27)',
        advancedFilter: 'Filter',
        apply: 'Apply',
        questionPoolDebug: 'Question Pool (Debug)',
        empty: 'Empty',
        language: 'Language:'
      },
      en: {
        title: 'SpeedCalender Last 2 Digit Memorize trainer',
        settings: 'Settings',
        presetMode: 'Preset',
        advancedMode: 'Advanced',
        preset: 'Preset',
        presetAll: 'All (00-99)',
        presetEasy: 'Easy (0-27)',
        advancedFilter: 'Filter',
        apply: 'Apply',
        questionPoolDebug: 'Question Pool (Debug)',
        empty: 'Empty',
        language: 'Language:'
      },
      zh: {
        title: '速度日历 后两位数练习机',
        settings: '题目设置',
        presetMode: 'Preset',
        advancedMode: 'Advanced',
        preset: 'Preset',
        presetAll: 'All (00-99)',
        presetEasy: 'Easy (0-27)',
        advancedFilter: 'Filter',
        apply: 'Apply',
        questionPoolDebug: 'Question Pool (Debug)',
        empty: 'Empty',
        language: 'Language:'
      }
    };

    const siteTitle = document.getElementById('siteTitle');
    const questionEl = document.getElementById('question');
    const lastQuestionEl = document.getElementById('lastQuestion');
    const lastAnswerEl = document.getElementById('lastAnswer');
    const lastCorrectEl = document.getElementById('lastCorrect');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsSection = document.getElementById('settingsSection');
    const modeLabel = document.getElementById('modeLabel');
    const presetModeText = document.getElementById('presetModeText');
    const advancedModeText = document.getElementById('advancedModeText');
    const presetText = document.getElementById('presetText');
    const presetAllText = document.getElementById('presetAllText');
    const presetEasyText = document.getElementById('presetEasyText');
    const advancedFilterLabel = document.getElementById('advancedFilterLabel');
    const advancedFilter = document.getElementById('advancedFilter');
    const applyFilterButton = document.getElementById('applyFilterButton');
    const questionPoolDebugToggle = document.getElementById('questionPoolDebugToggle');
    const questionPoolDebugBody = document.getElementById('questionPoolDebugBody');
    const questionPoolDebugSummary = document.getElementById('questionPoolDebugSummary');
    const questionPoolDebugStats = document.getElementById('questionPoolDebugStats');
    const languageLabel = document.getElementById('languageLabel');
    const languageSelect = document.getElementById('languageSelect');
    const presetBox = document.getElementById('presetBox');
    const advancedBox = document.getElementById('advancedBox');
    const settingModeInputs = document.querySelectorAll('input[name="settingMode"]');
    const presetInputs = document.querySelectorAll('input[name="preset"]');

    const allNumbers = Array.from({ length: 100 }, (_, n) => n);
    const shortcuts = {
      all: () => rangeNumbers(0, 99),
      cycle1: () => rangeNumbers(0, 27),
      cycle2: () => rangeNumbers(28, 55),
      cycle3: () => rangeNumbers(56, 83),
      cycle4: () => rangeNumbers(84, 99),
      doubles: () => [0, 11, 22, 33, 44, 55, 66, 77, 88, 99]
    };

    let currentNumber = 0;
    let currentLanguage = 'ja';
    let questionPool = shortcuts.all();

    function yearValue(n) {
      return values[n % 28];
    }

    function formatNumber(n) {
      return String(n).padStart(2, '0');
    }

    function rangeNumbers(start, end) {
      const min = Math.max(0, Math.min(start, end));
      const max = Math.min(99, Math.max(start, end));
      return Array.from({ length: max - min + 1 }, (_, index) => min + index);
    }

    function numbersForValue(value) {
      return allNumbers.filter(n => yearValue(n) === value);
    }

    function currentSettingMode() {
      return document.querySelector('input[name="settingMode"]:checked').value;
    }

    function currentPreset() {
      return document.querySelector('input[name="preset"]:checked').value;
    }

    function splitCommands(filterText) {
      return filterText
        .split(/[\n/]+/)
        .map(command => command.trim())
        .filter(Boolean);
    }

    function expandCommand(baseCommand) {
      if (shortcuts[baseCommand]) {
        return shortcuts[baseCommand]();
      }

      const groupMatch = baseCommand.match(/^group([0-6])$/);
      if (groupMatch) {
        return numbersForValue(Number(groupMatch[1]));
      }

      const rangeMatch = baseCommand.match(/^(\d{1,2})-(\d{1,2})$/);
      if (rangeMatch) {
        return rangeNumbers(Number(rangeMatch[1]), Number(rangeMatch[2]));
      }

      const numberMatch = baseCommand.match(/^\d{1,2}$/);
      if (numberMatch) {
        const number = Number(baseCommand);
        return number <= 99 ? [number] : [];
      }

      return [];
    }

    function removeFromPool(pool, numbers, multiplier) {
      // Multiplier repeats the whole exclusion command, so !group1*3
      // removes three group1 sets instead of every group1 entry.
      const removeCounts = new Map();

      for (let i = 0; i < multiplier; i += 1) {
        numbers.forEach(number => {
          removeCounts.set(number, (removeCounts.get(number) || 0) + 1);
        });
      }

      return pool.filter(number => {
        const remaining = removeCounts.get(number) || 0;
        if (remaining === 0) {
          return true;
        }

        removeCounts.set(number, remaining - 1);
        return false;
      });
    }

    function parseFilter(filterText) {
      let pool = [];

      splitCommands(filterText).forEach(command => {
        const isExclude = command.startsWith('!');
        const commandBody = isExclude ? command.slice(1) : command;
        const multiplierMatch = commandBody.match(/^(.*)\*(\d+)$/);
        const baseCommand = multiplierMatch ? multiplierMatch[1].trim() : commandBody.trim();
        const multiplier = multiplierMatch ? Number(multiplierMatch[2]) : 1;

        if (!baseCommand || !Number.isInteger(multiplier) || multiplier < 1) {
          return;
        }

        const numbers = expandCommand(baseCommand);
        if (numbers.length === 0) {
          return;
        }

        if (isExclude) {
          pool = removeFromPool(pool, numbers, multiplier);
          return;
        }

        for (let i = 0; i < multiplier; i += 1) {
          pool.push(...numbers);
        }
      });

      return pool.length > 0 ? pool : shortcuts.all();
    }

    function presetFilterCommand() {
      return currentPreset() === 'cycle1' ? 'cycle1' : 'all';
    }

    function questionPoolCounts(pool) {
      const counts = new Map();
      pool.forEach(number => {
        counts.set(number, (counts.get(number) || 0) + 1);
      });

      return Array.from(counts.entries()).sort((a, b) => a[0] - b[0]);
    }

    function formatQuestionPoolSummary(pool) {
      const counts = questionPoolCounts(pool);
      if (counts.length === 0) {
        return translations[currentLanguage].empty;
      }

      return counts
        .map(([number, count]) => `${number}×${count}`)
        .join(' / ');
    }

    function updateQuestionPoolDebug() {
      const counts = questionPoolCounts(questionPool);
      questionPoolDebugSummary.textContent = formatQuestionPoolSummary(questionPool);
      questionPoolDebugStats.innerHTML = `Total: ${questionPool.length}<br>Unique: ${counts.length}`;
    }

    function updateQuestionPoolDebugToggle() {
      const mark = questionPoolDebugBody.hidden ? '▼' : '▲';
      questionPoolDebugToggle.textContent = `${mark} ${translations[currentLanguage].questionPoolDebug}`;
      questionPoolDebugToggle.setAttribute('aria-expanded', String(!questionPoolDebugBody.hidden));
    }

    function applyQuestionPool(filterText) {
      questionPool = parseFilter(filterText);
      setNextQuestion();
      updateQuestionPoolDebug();
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function setNextQuestion() {
      currentNumber = randomItem(questionPool);
      questionEl.textContent = formatNumber(currentNumber);
    }

    function isCorrectAnswer(answer, correct) {
      return answer === correct;
    }

    function updateSettingsToggle() {
      const mark = settingsPanel.classList.contains('open') ? '▲' : '▼';
      settingsToggle.textContent = `${mark} ${translations[currentLanguage].settings}`;
    }

    function updateSettingPanels() {
      const isPreset = currentSettingMode() === 'preset';
      presetBox.hidden = !isPreset;
      advancedBox.hidden = isPreset;
    }

    function updateLanguage() {
      const text = translations[currentLanguage];
      document.documentElement.lang = currentLanguage;
      document.title = text.title;
      siteTitle.textContent = text.title;
      presetModeText.textContent = text.presetMode;
      advancedModeText.textContent = text.advancedMode;
      presetText.textContent = text.preset;
      presetAllText.textContent = text.presetAll;
      presetEasyText.textContent = text.presetEasy;
      advancedFilterLabel.textContent = text.advancedFilter;
      applyFilterButton.textContent = text.apply;
      languageLabel.textContent = text.language;
      updateSettingsToggle();
      updateQuestionPoolDebugToggle();
      updateQuestionPoolDebug();
    }

    function updateModeLabel() {
      modeLabel.textContent = currentSettingMode() === 'preset'
        ? `Mode:Preset(${currentPreset() === 'cycle1' ? 'Easy' : 'All'})`
        : 'Mode:Advanced';
    }

    function answer(value) {
      const correct = yearValue(currentNumber);
      const ok = isCorrectAnswer(value, correct);

      lastQuestionEl.textContent = formatNumber(currentNumber);
      lastAnswerEl.textContent = value;
      lastCorrectEl.textContent = correct;
      lastCorrectEl.className = ok ? 'correct' : 'wrong';

      setNextQuestion();
    }

    document.querySelectorAll('[data-answer]').forEach(button => {
      button.addEventListener('click', () => answer(Number(button.dataset.answer)));
    });

    document.addEventListener('keydown', event => {
      const targetTag = event.target.tagName;
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(targetTag)) {
        return;
      }

      if (/^[0-6]$/.test(event.key)) {
        answer(Number(event.key));
      }
    });

    settingsToggle.addEventListener('click', () => {
      const open = !settingsPanel.classList.contains('open');
      settingsPanel.classList.toggle('open', open);
      settingsSection.classList.toggle('open', open);
      settingsToggle.setAttribute('aria-expanded', String(open));
      updateSettingsToggle();
    });

    settingModeInputs.forEach(input => input.addEventListener('change', () => {
      updateSettingPanels();
      updateModeLabel();
      if (currentSettingMode() === 'preset') {
        applyQuestionPool(presetFilterCommand());
      }
    }));

    presetInputs.forEach(input => input.addEventListener('change', () => {
      updateModeLabel();
      if (currentSettingMode() === 'preset') {
        applyQuestionPool(presetFilterCommand());
      }
    }));

    applyFilterButton.addEventListener('click', () => {
      if (currentSettingMode() === 'advanced') {
        applyQuestionPool(advancedFilter.value);
      }
    });

    questionPoolDebugToggle.addEventListener('click', () => {
      questionPoolDebugBody.hidden = !questionPoolDebugBody.hidden;
      updateQuestionPoolDebugToggle();
    });

    languageSelect.addEventListener('change', () => {
      currentLanguage = languageSelect.value;
      updateLanguage();
    });

    updateLanguage();
    updateSettingPanels();
    updateModeLabel();
    applyQuestionPool(presetFilterCommand());
  </script>
</body>
</html>
